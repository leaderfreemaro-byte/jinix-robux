<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JINIX</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080b16;
    color: white;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: #101528;
    border-bottom: 1px solid #26314c;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #00d9ff;
    letter-spacing: 3px;
}

.menu {
    font-size: 25px;
    color: #00d9ff;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 430px;
    text-align: center;
    padding: 40px 25px;
    background: linear-gradient(145deg, #151d35, #101426);
    border: 1px solid #263d65;
    border-radius: 24px;
    box-shadow: 0 0 35px rgba(0, 217, 255, 0.12);
}

.icon {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    font-size: 38px;
    color: #00d9ff;
    margin-bottom: 15px;
}

.description {
    font-size: 18px;
    line-height: 1.8;
    color: #c4cce0;
    margin-bottom: 28px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00d9ff, #537bff);
    color: #07101e;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

#message {
    margin-top: 22px;
    color: #00e6a8;
    font-size: 18px;
    line-height: 1.7;
}

footer {
    padding: 20px;
    text-align: center;
    color: #7f8ba8;
    font-size: 13px;
}
</style></head><body><header>
    <div class="logo">JINIX</div>
    <div class="menu">☰</div>
</header><main>
    <section class="card">
        <div class="icon">🌐</div>
        <h1>مرحبا بك!</h1>    <p class="description">
        مرحباً بك في JINIX<br>
        اكتشف عالماً جديداً من الإبداع.
    </p>

    <button onclick="welcome()">دخول الموقع</button>

    <p id="message"></p>
</section>

</main><footer>
    © 2026 JINIX — جميع الحقوق محفوظة
</footer><script>
function welcome() {
    document.getElementById("message").textContent =
        "أهلاً وسهلاً بك في JINIX! نتمنى لك تجربة ممتعة.";
}
</script></body>
</html>
